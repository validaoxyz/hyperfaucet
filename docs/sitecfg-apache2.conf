
# Requires mod_headers. Keep these directives unguarded so configtest fails if
# the module is missing instead of silently dropping the security headers.
Header always setifempty Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Header always set Referrer-Policy "no-referrer"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"

# Default virtual hosts reject unconfigured names. Replace the certificate paths
# together with the named faucet virtual host below.
<VirtualHost *:80>
    ServerName invalid.example
    Redirect 404 /
</VirtualHost>

<VirtualHost *:443>
    ServerName invalid.example
    SSLEngine On
    <Location "/">
        Require all denied
    </Location>
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/kiln-faucet.pk910.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kiln-faucet.pk910.de/privkey.pem
</VirtualHost>

<VirtualHost *:80>
    ServerAdmin webmaster@pk910.de
    ServerName kiln-faucet.pk910.de
    ServerAlias www.kiln-faucet.pk910.de

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^(www\.)?kiln-faucet\.pk910\.de(?::[0-9]+)?$ [NC]
    RewriteRule ^ - [R=421,L]

    Redirect permanent / https://kiln-faucet.pk910.de/

    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/access-kiln-faucet.pk910.de.log vhost_combined
    ErrorLog ${APACHE_LOG_DIR}/error-kiln-faucet.pk910.de.log
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@pk910.de
    ServerName kiln-faucet.pk910.de
    ServerAlias www.kiln-faucet.pk910.de
    SSLEngine On

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^(www\.)?kiln-faucet\.pk910\.de(?::[0-9]+)?$ [NC]
    RewriteRule ^ - [R=421,L]

    # Document root of the faucet site (static folder)
    DocumentRoot /home/powfaucet/kiln-faucet/static
    <Directory /home/powfaucet/kiln-faucet/static/>
            Options -Indexes +FollowSymLinks +MultiViews
            AllowOverride All
            Require all granted
    </Directory>

    # Prefer index.seo.html as index for better search engine results
    DirectoryIndex index.seo.html index.html

    # Redirect websocket calls (/pow) to nodejs faucet process
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader append X-Forwarded-Proto "https"
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /ws/(.*)$       ws://localhost:8080/ws/$1 [P,L]
    RewriteRule /api/(.*)$      http://localhost:8080/api/$1 [P,L]

    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/access-kiln-faucet.pk910.de.log vhost_combined
    ErrorLog ${APACHE_LOG_DIR}/error-kiln-faucet.pk910.de.log

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/kiln-faucet.pk910.de/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/kiln-faucet.pk910.de/privkey.pem
</VirtualHost>
